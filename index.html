<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4fff8"><meta name="format-detection" content="telephone=no"><meta name="description" content="松手落下、碰撞合成更大奶蛋的奶蛙小游戏">
<title>合成奶蛙｜奶蛋研究所</title>
<style>
:root{--ink:#25343a;--muted:#70827d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f4fff8,#fff4d9);font-family:ui-rounded,"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:22px 14px 30px}.app{width:min(520px,100%)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:clamp(30px,8vw,42px);line-height:1;margin:0}.sub{color:var(--muted);font-size:13px;margin:7px 0 0}.logo{font-weight:800;color:#4f8e70;background:#fff;border:1px solid #d9eee1;border-radius:14px;padding:9px 11px;white-space:nowrap;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:#ffffffd9;border:1px solid #e1eee7;border-radius:13px;padding:9px 12px;box-shadow:0 5px 16px #78998618}.stat small{display:block;font-size:11px;color:#81918c}.stat b{font-size:23px;line-height:1.2}.game{background:#fff;border:1px solid #deeee6;border-radius:22px;padding:12px;box-shadow:0 16px 40px #6e9a7b24}.topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}.tip{font-size:12px;color:var(--muted)}button{font:inherit;font-weight:800;color:#fff;background:var(--ink);border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.stage{position:relative;width:100%;aspect-ratio:420/640;border-radius:16px;overflow:hidden;background:#f8fff9;border:1px solid #dcefe5}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff9e9cc;backdrop-filter:blur(3px);text-align:center;padding:22px}.overlay.show{display:flex}.over-card{background:#fff;border:1px solid #f0dec1;border-radius:18px;padding:20px 24px;box-shadow:0 12px 30px #9c7a3a22}.over-card h2{margin:0 0 5px;font-size:28px}.over-card p{margin:0 0 14px;color:var(--muted);font-size:14px}.bottom{display:flex;align-items:center;justify-content:space-between;padding:11px 3px 0;color:var(--muted);font-size:12px}.next{display:flex;align-items:center;gap:8px}.next img{width:44px;height:44px;object-fit:contain;background:#f6fff9;border:1px solid #dcefe5;border-radius:12px;padding:3px}.chain{display:flex;gap:3px;align-items:center}.chain span{display:inline-flex;align-items:center;gap:2px;background:#f3faf5;padding:4px 5px;border-radius:99px;color:#668274;font-size:10px}.chain img{width:18px;height:18px;object-fit:contain}@media(max-width:400px){body{padding:14px 9px}.game{padding:9px}.tip{font-size:11px}.stat{padding:8px 9px}.stat b{font-size:20px}}
</style></head>
<body><main class="app"><header><div><h1>合成奶蛙</h1><p class="sub">松手落下，两个一样的奶蛙会合成更大的奶蛋</p></div><div class="logo">🐸 奶蛋研究所</div></header>
<section class="stats"><div class="stat"><small>当前得分</small><b id="score">0</b></div><div class="stat"><small>最高等级</small><b id="best">奶蛙</b></div><div class="stat"><small>本局合成</small><b id="merges">0</b></div></section>
<section class="game"><div class="topbar"><span class="tip">左右移动瞄准，松手投放</span><button id="resetBtn">重新开始</button></div><div class="stage"><canvas id="canvas" width="420" height="640" aria-label="奶蛙合成游戏"></canvas><div class="overlay" id="over"><div class="over-card"><h2>堆到线啦</h2><p>这局得分 <b id="finalScore">0</b>，再试一次吧</p><button id="overBtn">重新开始</button></div></div></div><div class="bottom"><div class="next"><span>下一只</span><img id="nextImg" alt="下一只奶蛙"><span id="nextName">跳跳奶蛙</span></div><div class="chain" id="chain"></div></div></section></main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=420,H=640,dropLine=82,dangerLine=150;
const files=['assets/frog-1.png','assets/frog-2.png','assets/frog-3.png','assets/frog-4.png','assets/frog-5.png','assets/frog-7.png','assets/frog-6.png'];
const names=['跳跳奶蛙','抱抱奶蛙','元气奶蛙','大肚奶蛙','奶蛋蛙','捂脸奶蛋','大奶蛋'];
const radii=[25,34,43,53,62,70,80],points=[10,25,55,100,180,300,500],images=files.map(src=>{const im=new Image();im.src=src;return im});
let bodies=[],score=0,merges=0,best=0,next=0,aimX=W/2,canDrop=true,gameOver=false,last=0,particles=[];
function randNext(){return Math.floor(Math.random()*Math.min(3,best+2))}function reset(){bodies=[];score=0;merges=0;best=0;next=randNext();aimX=W/2;canDrop=true;gameOver=false;particles=[];document.getElementById('over').classList.remove('show');sync()}
function sync(){document.getElementById('score').textContent=score;document.getElementById('merges').textContent=merges;document.getElementById('best').textContent=names[best];document.getElementById('nextImg').src=files[next];document.getElementById('nextName').textContent=names[next];document.getElementById('chain').innerHTML=files.map((f,i)=>`<span><img src="${f}" alt="">${i+1}</span>`).join('')}
function circle(x,y,l,vx=0,vy=0){return{x,y,l,vx,vy,r:radii[l],age:0,quiet:0,merged:false}}
function drop(){if(!canDrop||gameOver)return;const x=Math.max(radii[next]+3,Math.min(W-radii[next]-3,aimX));bodies.push(circle(x,dropLine+5,next,0,20));next=randNext();canDrop=false;sync();setTimeout(()=>canDrop=true,430)}
function pointerX(e){const q=canvas.getBoundingClientRect();return(e.clientX-q.left)*W/q.width}canvas.addEventListener('pointermove',e=>{aimX=pointerX(e);e.preventDefault()},{passive:false});canvas.addEventListener('pointerdown',e=>{aimX=pointerX(e);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointerup',drop);canvas.addEventListener('pointercancel',drop);if(!window.PointerEvent){const touchX=e=>{const t=e.touches?.[0]||e.changedTouches?.[0];return t?pointerX(t):aimX};canvas.addEventListener('touchstart',e=>{aimX=touchX(e);e.preventDefault()},{passive:false});canvas.addEventListener('touchmove',e=>{aimX=touchX(e);e.preventDefault()},{passive:false});canvas.addEventListener('touchend',e=>{aimX=touchX(e);e.preventDefault();drop()},{passive:false})}
document.getElementById('resetBtn').onclick=reset;document.getElementById('overBtn').onclick=reset;
function merge(a,b){if(a.merged||b.merged||a.l!==b.l||a.l>=files.length-1)return false;const l=a.l+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;a.merged=b.merged=true;score+=points[l];merges++;best=Math.max(best,l);particles.push({x,y,life:1,text:'+'+points[l],color:'#d38e43'});bodies.push(circle(x,y,l,0,-110));return true}
function physics(dt){for(const b of bodies){b.age+=dt;b.vy+=920*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*.25}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.25}if(b.y+b.r>H){b.y=H-b.r;b.vy*=-.14;b.vx*=.96}if(Math.abs(b.vy)<30&&b.y-b.r<dangerLine)b.quiet+=dt;else b.quiet=Math.max(0,b.quiet-dt*.5)}for(let k=0;k<3;k++){for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j];if(a.merged||b.merged)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(d<min){if(merge(a,b))continue;const nx=dx/d,ny=dy/d,push=(min-d)/2;a.x-=nx*push;b.x+=nx*push;a.y-=ny*push;b.y+=ny*push;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=rel*.45;a.vx+=nx*impulse;b.vx-=nx*impulse;a.vy+=ny*impulse;b.vy-=ny*impulse}}}}bodies=bodies.filter(b=>!b.merged);if(bodies.some(b=>b.quiet>.65))endGame()}
function endGame(){if(gameOver)return;gameOver=true;document.getElementById('finalScore').textContent=score;document.getElementById('over').classList.add('show')}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fbfff9');bg.addColorStop(1,'#edf9f0');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff2e2';ctx.fillRect(0,dangerLine,W,2);ctx.setLineDash([7,6]);ctx.strokeStyle='#ee9c6c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,dangerLine);ctx.lineTo(W,dangerLine);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#bd8563';ctx.font='11px ui-rounded,Microsoft YaHei,sans-serif';ctx.fillText('危险线',W-42,dangerLine-7);if(canDrop&&!gameOver){ctx.globalAlpha=.2;ctx.strokeStyle='#79b58f';ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(aimX,dropLine-40);ctx.lineTo(aimX,H);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;drawFrog(aimX,dropLine-27,next,true)}for(const b of bodies)drawFrog(b.x,b.y,b.l,false);for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.font='bold 22px ui-rounded,Microsoft YaHei,sans-serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}ctx.textAlign='start'}
function drawFrog(x,y,l,preview){const im=images[l],size=radii[l]*2*(preview?.92:1.12);ctx.save();ctx.globalAlpha=preview?.72:1;ctx.shadowColor=preview?'transparent':'#7052262c';ctx.shadowBlur=preview?0:7;ctx.drawImage(im,x-size/2,y-size/2,size,size);ctx.restore()}
function frame(t){if(!last)last=t;const dt=Math.min(.025,(t-last)/1000);last=t;if(!gameOver){physics(dt);for(const p of particles)p.life-=dt*1.8;particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
