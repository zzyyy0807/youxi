<!doctype html>
<html lang="zh-CN">
<head>

<title>合成大奶蛙｜云端奶蛙研究所</title>
<style>
:root{--ink:#2d3430;--muted:#7c8173;--paper:#fffdf7;--green:#6a9e79;--line:#ed9c61;--gold:#f1bd57}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}body{background:linear-gradient(135deg,#e5f5f3d9,#fff6dfdb),url('assets/sky-frog-bg.jpg') center/cover fixed;display:flex;justify-content:center;padding:22px 14px 34px}.app{width:min(530px,100%)}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.eyebrow{margin:0 0 4px;color:#8f7852;font-size:12px;font-weight:800;letter-spacing:.08em}.brand h1{margin:0;font-size:clamp(31px,8vw,46px);line-height:1;letter-spacing:0}.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}.mark{background:#ffffffc7;border:1px solid #eadbb4;border-radius:16px;padding:10px 12px;color:#967d48;font-weight:800;white-space:nowrap;font-size:12px}
.hud{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px;margin-bottom:12px}.hud-item{background:#ffffffc7;border:1px solid #eee0c0;border-radius:14px;padding:10px 12px;box-shadow:0 7px 18px #987b3e18}.hud-item span{display:block;color:#918c79;font-size:11px}.hud-item b{font-size:23px;line-height:1.2}.hud-item.level b{font-size:17px;color:#5f8e6b}
.game-card{background:#ffffffe8;border:1px solid #eadfc9;border-radius:24px;padding:12px;box-shadow:0 20px 44px #8b75421f}.game-head{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 10px}.head-actions{display:flex;align-items:center;gap:7px}.hint{color:var(--muted);font-size:12px}.restart,.leader-btn,.sound-btn{border:0;background:var(--ink);color:#fff;border-radius:11px;padding:9px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.leader-btn{background:#d28d4c}.sound-btn{background:#668e70;padding:9px 10px;min-width:38px}.restart:active,.leader-btn:active,.sound-btn:active{transform:translateY(1px)}
.stage{position:relative;width:100%;aspect-ratio:420/500;overflow:hidden;border:1px solid #e7e0c9;border-radius:18px;background:#fffaf0}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.overlay,.start-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff8e8d9;backdrop-filter:blur(4px);padding:18px;text-align:center}.overlay.show,.start-overlay.show{display:flex}.result,.start-card{width:min(300px,100%);border:1px solid #ebd6a5;border-radius:20px;background:#fffef9;padding:22px 20px;box-shadow:0 14px 34px #90784426}.result .angel{font-size:31px}.result h2,.start-card h2{margin:7px 0 5px;font-size:27px}.result p,.start-card p{margin:0 0 16px;color:var(--muted);font-size:13px}.result strong{color:#a36e2c;font-size:19px}.result button,.start-card button{border:0;border-radius:11px;background:#557e61;color:#fff;padding:11px 20px;font:inherit;font-weight:800;cursor:pointer}.start-card .start-icon{font-size:36px}.auto{margin-top:10px;color:#a79a7d;font-size:11px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 3px 0}.next{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.next figure{margin:0;width:49px;height:49px;display:grid;place-items:center;background:#fffaf0;border:1px solid #e6dcc4;border-radius:13px;overflow:hidden}.next img{width:100%;height:100%;object-fit:contain;padding:3px}.next b{color:#6c806f;font-size:12px}.ladder{display:flex;align-items:center;justify-content:flex-end;gap:1px;max-width:70%;overflow:hidden}.ladder img{width:21px;height:21px;object-fit:contain;opacity:.82}.ladder img.final{width:24px;height:24px;opacity:1}.cloud-login{display:flex;align-items:center;gap:7px;margin-top:12px;padding:10px 11px;border:1px solid #eadfc9;border-radius:14px;background:#fffdf4}.cloud-login label{font-size:12px;color:#796e5a;white-space:nowrap}.cloud-login input{min-width:0;flex:1;border:1px solid #e5d9bd;border-radius:9px;background:#fff;padding:8px 9px;font:inherit;font-size:12px;outline:0}.cloud-login input:focus{border-color:#d39a56}.cloud-login button{border:0;border-radius:9px;padding:8px 10px;background:#668e70;color:#fff;font:inherit;font-size:12px;font-weight:800;white-space:nowrap}.cloud-state{font-size:10px;color:#9b917e;white-space:nowrap}.leaderboard{margin-top:12px;border:1px solid #eadfc9;border-radius:18px;background:#fffaf0d9;padding:13px 14px}.leader-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.leader-title h2{font-size:15px;margin:0}.leader-title span{font-size:11px;color:#aa8a56}.ranking{list-style:none;padding:0;margin:0;display:grid;gap:5px}.ranking li{display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:7px;padding:6px 8px;border-radius:10px;background:#ffffffa8;color:#687466;font-size:12px}.ranking li.me{background:#fff0c4;color:#9b6e32;font-weight:800}.rank-no{font-size:14px;text-align:center}.rank-score{font-weight:800;color:#8b6b39}.rank-note{margin:8px 0 0;color:#a79a7d;font-size:10px}
@media(max-width:400px){body{padding:14px 9px 24px}.game-card{padding:9px;border-radius:20px}.brand h1{font-size:32px}.hud-item{padding:8px 9px}.hud-item b{font-size:20px}.hint{font-size:11px}.mark{padding:8px 9px}.head-actions{gap:4px}.leader-btn,.restart{padding:8px 9px}.cloud-login{flex-wrap:wrap}.cloud-login label{width:100%}.cloud-state{margin-left:auto}}
body{padding:14px 14px 24px}.brand{margin-bottom:10px}.brand p{margin-top:6px}.hud{margin-bottom:8px}.hud-item{padding:8px 10px}.game-card{padding:9px;border-radius:22px}.game-head{padding-bottom:7px}.stage{aspect-ratio:420/500}.footer{padding-top:8px}.next figure{width:45px;height:45px}.cloud-login{margin-top:8px;padding:8px 10px}.leaderboard{margin-top:8px;padding:10px 12px}
@media(max-width:400px){body{padding:10px 8px 16px}.game-card{padding:8px;border-radius:19px}.hud-item{padding:7px 8px}.mark{padding:7px 8px}.leader-btn,.restart{padding:7px 8px}}
</style>
</head>
<body>
<main class="app">
  <header class="brand"><div><p class="eyebrow">CLOUD FROG LAB  /  01</p><h1>合成大奶蛙</h1><p>重生后，我发现从天而降了一群奶蛙，让他们尽快合成变为更大的奶蛙吧！千万不要过线哦~</p></div><div class="mark">🎧 云端蛙舍</div></header>
  <section class="hud"><div class="hud-item"><span>本局得分</span><b id="score">0</b></div><div class="hud-item level"><span>最高形态</span><b id="best">奶蛋</b></div><div class="hud-item"><span>合成次数</span><b id="merges">0</b></div></section>
  <section class="game-card">
    <div class="game-head"><span class="hint">拖动瞄准，松手让它落下</span><div class="head-actions"><button type="button" class="sound-btn" id="soundToggle" aria-label="开启或关闭声音" title="声音">🔊</button><button type="button" class="leader-btn" id="leaderBtn">排行榜</button><button type="button" class="restart" id="restart">重新开始</button></div></div>
    <div class="stage"><canvas id="canvas" width="420" height="500" aria-label="合成大奶蛙游戏"></canvas><div class="start-overlay show" id="startOverlay"><div class="start-card"><div class="start-icon">🐸</div><h2>准备好了吗？</h2><p>点击开始，让奶蛙从天而降！</p><button type="button" id="startGame">开始游戏</button></div></div><div class="overlay" id="overlay"><div class="result"><div class="angel">⚠️</div><h2>奶龙逃离了安全区</h2><p>本局得分 <strong id="finalScore">0</strong></p><p id="rankText">准备冲进排行榜！</p><button type="button" id="again">重新开始</button></div></div></div>
    <div class="footer"><div class="next"><span>下一只</span><figure><img id="nextImg" alt="下一只奶蛋"></figure><b id="nextName">奶蛋</b></div><div class="ladder" id="ladder" aria-label="形态进化顺序"></div></div>
    <div class="cloud-login"><label for="nickname">云榜昵称</label><input id="nickname" maxlength="16" placeholder="输入你的蛙名"><button id="saveName">进入云榜</button><span class="cloud-state" id="cloudState">连接云榜中…</span></div>
    <section class="leaderboard" id="leaderboard"><div class="leader-title"><h2>🏆 云端奶蛙排行榜</h2><span id="leaderMode">在线榜单</span></div><ol class="ranking" id="ranking"></ol><p class="rank-note">登录昵称后，结束游戏会自动提交本局成绩。</p></section>
  </section>
</main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=420,H=500,dropY=68,dangerY=126,dangerHold=1,lastLevel=8,sky=new Image();sky.src='assets/sky-frog-bg.jpg';
const SUPABASE_URL='https://rkufyqepvfzyplyosbgx.supabase.co',SUPABASE_KEY='sb_publishable_L17KugkQ2iqoeub2YszCBA_m6rIHUxS',REST_URL=SUPABASE_URL+'/rest/v1/leaderboard',cloudHeaders={apikey:SUPABASE_KEY};
const files=['assets/frog-6.png','assets/frog-1.png','assets/frog-2.png','assets/frog-3.png','assets/frog-4.png','assets/frog-5.png','assets/frog-7.png','assets/frog-8.png','assets/frog-9.png'];
const names=['奶蛋','跳跳奶蛙','抱抱奶蛙','元气奶蛙','大肚奶蛙','奶蛋蛙','捂脸奶蛋','快乐奶蛙','天使'];
const radii=[22,28,35,42,50,59,69,80,92],points=[8,18,36,66,110,180,290,460,900],images=files.map(()=>new Image());
let bodies=[],score=0,merges=0,best=0,next=0,aimX=W/2,canDrop=true,gameOver=false,gameStarted=false,lastTime=0,particles=[],restartTimer=0,lastRank=0,cloudScores=null,nickname=localStorage.getItem('cloudFrogNickname')||'',dropCount=0,dangerClock=0;
const audio={ctx:null,master:null,bg:null,effects:{},enabled:true};
function ensureAudio(){if(audio.ctx){if(audio.ctx.state==='suspended')audio.ctx.resume();return true}const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return false;audio.ctx=new AudioContext();audio.master=audio.ctx.createGain();audio.master.gain.value=.22;audio.master.connect(audio.ctx.destination);audio.musicGain=audio.ctx.createGain();audio.musicGain.gain.value=.42;audio.musicGain.connect(audio.master);return true}
function playTone(frequency,duration,type='sine',volume=.12){if(!audio.enabled||!ensureAudio())return;const now=audio.ctx.currentTime,osc=audio.ctx.createOscillator(),gain=audio.ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(frequency,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audio.master);osc.start(now);osc.stop(now+duration+.03)}
function startMusic(){if(!audio.enabled)return;if(!audio.bg){audio.bg=new Audio('assets/background.mp3');audio.bg.loop=true;audio.bg.volume=.24}audio.bg.play().catch(()=>{})}
function stopMusic(){if(audio.bg){audio.bg.pause();audio.bg.currentTime=0}}
function toggleSound(){audio.enabled=!audio.enabled;const button=document.getElementById('soundToggle');button.textContent=audio.enabled?'🔊':'🔇';if(audio.enabled){ensureAudio();startMusic()}else stopMusic()}
function playAudioFile(name,fallback){if(!audio.enabled)return;let player=audio.effects[name];if(!player){player=new Audio('assets/'+name+'.mp3');player.preload='auto';player.volume=.55;audio.effects[name]=player}player.currentTime=0;const result=player.play();if(result&&result.catch)result.catch(()=>fallback&&fallback())}
function unlockSoundFiles(){['merge','merge-1','merge-2','merge-3','merge-4','merge-5','merge-6','merge-7','merge-8','merge-9'].forEach(name=>{const player=audio.effects[name]||new Audio('assets/'+name+'.mp3');audio.effects[name]=player;player.volume=0;const result=player.play();if(result&&result.then)result.then(()=>{player.pause();player.currentTime=0;player.volume=.55}).catch(()=>{})})}
function playMergeSound(level){const specific='merge-'+(level+1),fallback=()=>playAudioFile('merge',()=>playTone(280+level*42,.16,'sine',.14));playAudioFile(specific,fallback);if(level>=lastLevel-1)setTimeout(()=>playTone(560,.24,'triangle',.12),90)}
function chooseNext(){const ceiling=Math.min(4,2+Math.floor(dropCount/14));return Math.floor(Math.random()*Math.min(ceiling,best+2))}
function reset(showStart=true){clearTimeout(restartTimer);bodies=[];score=0;merges=0;best=0;dropCount=0;dangerClock=0;next=chooseNext();aimX=W/2;canDrop=true;gameOver=false;gameStarted=false;lastTime=0;particles=[];document.getElementById('overlay').classList.remove('show');document.getElementById('startOverlay').classList.toggle('show',showStart);sync()}
function beginGame(){gameStarted=true;gameOver=false;lastTime=0;document.getElementById('startOverlay').classList.remove('show');ensureAudio();unlockSoundFiles();startMusic()}
function newRound(){reset(false);beginGame()}
function readScores(){try{return JSON.parse(localStorage.getItem('cloudFrogScores')||'[]')}catch(e){return[]}}
function saveScore(){const old=readScores();old.push({score,name:nickname||'本局的你',date:new Date().toLocaleDateString('zh-CN')});old.sort((a,b)=>b.score-a.score);const top=old.slice(0,5);try{localStorage.setItem('cloudFrogScores',JSON.stringify(top))}catch(e){}lastRank=Math.max(1,top.findIndex(x=>x.score===score)+1);renderLeaderboard(top);return lastRank}
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderLeaderboard(scores=cloudScores||readScores()){const seed=[{score:1680,name:'耳机蛙王'},{score:980,name:'云朵摸鱼王'},{score:420,name:'奶蛋新手'}];const list=scores.length?scores:seed;document.getElementById('ranking').innerHTML=list.slice(0,5).map((x,i)=>`<li class="${x.score===score&&x.nickname===nickname||x.score===score&&x.name===nickname?'me':''}"><span class="rank-no">${['🥇','🥈','🥉','4','5'][i]}</span><span>${escapeHTML(x.nickname||x.name)}</span><span class="rank-score">${x.score} 分</span></li>`).join('')}
async function loadCloudScores(attempt=0){try{const query='?select=nickname,score,best_level,merges,created_at&order=score.desc,created_at.asc&limit=10';const response=await fetch(REST_URL+query,{headers:{...cloudHeaders,Authorization:'Bearer '+SUPABASE_KEY,Accept:'application/json'},cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw new Error('invalid response');cloudScores=data;document.getElementById('cloudState').textContent='已连接云榜（'+data.length+'人）';document.getElementById('leaderMode').textContent='在线榜单';renderLeaderboard(cloudScores)}catch(error){if(attempt<2){setTimeout(()=>loadCloudScores(attempt+1),700);return}cloudScores=null;document.getElementById('cloudState').textContent='云榜暂不可用，显示本机榜单';document.getElementById('leaderMode').textContent='本机榜单';renderLeaderboard(readScores())}}
async function submitCloudScore(){if(!nickname)return;document.getElementById('cloudState').textContent='成绩提交中…';try{const response=await fetch(REST_URL,{method:'POST',headers:{...cloudHeaders,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({nickname,score,best_level:names[best],merges})});if(!response.ok)throw new Error('HTTP '+response.status);document.getElementById('cloudState').textContent='已上云榜';document.getElementById('rankText').textContent='本局成绩已提交到云端排行榜';await loadCloudScores()}catch(error){document.getElementById('cloudState').textContent='提交失败，请检查 Supabase 表权限';document.getElementById('rankText').textContent='本局已保存，云榜暂时不可用'}}
function sync(){document.getElementById('score').textContent=score;document.getElementById('merges').textContent=merges;document.getElementById('best').textContent=names[best];document.getElementById('nextImg').src=files[next];document.getElementById('nextName').textContent=names[next];document.getElementById('ladder').innerHTML=files.map((f,i)=>`<img class="${i===lastLevel?'final':''}" src="${f}" alt="${names[i]}" title="${names[i]}">`).join('');renderLeaderboard()}
function makeBody(x,y,l,vx=0,vy=0){return{x,y,l,vx,vy,r:radii[l],quiet:0,dead:false,squish:0}}
function placeX(){return Math.max(radii[next]+4,Math.min(W-radii[next]-4,aimX))}
function drop(){if(!gameStarted||!canDrop||gameOver)return;dropCount++;bodies.push(makeBody(placeX(),dropY+9,next,0,24));next=chooseNext();canDrop=false;playTone(220,.08,'sine',.045);sync();setTimeout(()=>canDrop=true,Math.max(285,420-Math.floor(dropCount/10)*18))}
function pointerX(e){const rect=canvas.getBoundingClientRect();return(e.clientX-rect.left)*W/rect.width}
canvas.addEventListener('pointermove',e=>{aimX=pointerX(e);e.preventDefault()},{passive:false});canvas.addEventListener('pointerdown',e=>{aimX=pointerX(e);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointerup',drop);canvas.addEventListener('pointercancel',drop);
if(!window.PointerEvent){const touchX=e=>{const t=e.touches?.[0]||e.changedTouches?.[0];return t?pointerX(t):aimX};canvas.addEventListener('touchstart',e=>{aimX=touchX(e);e.preventDefault()},{passive:false});canvas.addEventListener('touchmove',e=>{aimX=touchX(e);e.preventDefault()},{passive:false});canvas.addEventListener('touchend',e=>{aimX=touchX(e);e.preventDefault();drop()},{passive:false})}
document.getElementById('nickname').value=nickname;document.getElementById('saveName').onclick=()=>{nickname=document.getElementById('nickname').value.trim().slice(0,16);if(!nickname){document.getElementById('cloudState').textContent='先写一个蛙名';return}localStorage.setItem('cloudFrogNickname',nickname);document.getElementById('cloudState').textContent='昵称已保存';loadCloudScores()};document.getElementById('startGame').addEventListener('click',beginGame);document.getElementById('restart').addEventListener('click',event=>{event.preventDefault();newRound()});document.getElementById('again').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();newRound()});document.getElementById('soundToggle').onclick=toggleSound;document.getElementById('leaderBtn').onclick=()=>{loadCloudScores();document.getElementById('leaderboard').scrollIntoView({behavior:'smooth',block:'center'})};
function merge(a,b,spawned){if(a.dead||b.dead||a.l!==b.l)return false;const l=a.l;a.dead=b.dead=true;merges++;score+=points[l];best=Math.max(best,l);dangerClock=0;playMergeSound(l);particles.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,life:1,text:l===lastLevel?'天使消失  +'+points[l]:'+'+points[l],color:l===lastLevel?'#c08d39':'#ad7940'});if(l<lastLevel)spawned.push(makeBody((a.x+b.x)/2,(a.y+b.y)/2,l+1,0,-115));return true}
function physics(dt){const spawned=[];const gravity=760+Math.min(360,Math.floor(dropCount/8)*45);for(const b of bodies){b.squish=Math.max(0,b.squish-dt*3.6);b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*.3;b.squish=Math.max(b.squish,.12)}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.3;b.squish=Math.max(b.squish,.12)}if(b.y+b.r>H){const impact=Math.abs(b.vy);b.y=H-b.r;if(impact>55)b.squish=Math.max(b.squish,Math.min(.85,impact/650));b.vy*=-.25;b.vx*=.985}}for(let pass=0;pass<3;pass++){for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j];if(a.dead||b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(d<min){if(merge(a,b,spawned))continue;const nx=dx/d,ny=dy/d,push=(min-d)/2;a.x-=nx*push;b.x+=nx*push;a.y-=ny*push;b.y+=ny*push;a.squish=Math.max(a.squish,.2);b.squish=Math.max(b.squish,.2);const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=rel*.32;a.vx+=nx*impulse;b.vx-=nx*impulse;a.vy+=ny*impulse;b.vy-=ny*impulse}}}}bodies=bodies.filter(b=>!b.dead).concat(spawned);const overLine=bodies.some(b=>!b.dead&&b.y<=dangerY+2);if(overLine)dangerClock=Math.min(dangerHold,dangerClock+dt);else dangerClock=0;if(dangerClock>=dangerHold||bodies.length>30)endGame()}
function endGame(){if(gameOver)return;gameOver=true;stopMusic();playTone(120,.42,'sawtooth',.16);const rank=saveScore();document.getElementById('finalScore').textContent=score;document.getElementById('rankText').textContent=nickname?'正在提交云端排行榜…':(rank<=5?'冲进本机前 '+rank+' 名！':'写个昵称就能上云榜！');submitCloudScore();document.getElementById('overlay').classList.add('show')}
function draw(){ctx.clearRect(0,0,W,H);if(sky.complete&&sky.naturalWidth){ctx.globalAlpha=.7;ctx.drawImage(sky,0,0,W,H);ctx.globalAlpha=1}ctx.fillStyle='#ffffff35';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff0d8';ctx.fillRect(0,dangerY,W,2);ctx.setLineDash([7,6]);ctx.strokeStyle='#e69b65';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,dangerY);ctx.lineTo(W,dangerY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ae7651';ctx.font='11px ui-rounded,Microsoft YaHei,sans-serif';ctx.fillText('安全区',W-42,dangerY-7);if(!gameOver){ctx.globalAlpha=.25;ctx.strokeStyle='#6f9e7a';ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(aimX,dropY-29);ctx.lineTo(aimX,H);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;drawImage(aimX,dropY-25,next,.78)}for(const b of bodies)drawImage(b.x,b.y,b.l,1.08,b.squish);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.font='bold 18px ui-rounded,Microsoft YaHei,sans-serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}ctx.textAlign='start'}
function drawImage(x,y,l,scale,squish=0){const img=images[l];if(!img.src)img.src=files[l];if(!img.complete||!img.naturalWidth)return;const box=radii[l]*2*scale,ratio=img.naturalWidth/img.naturalHeight;let w=box,h=box;if(ratio>1)h=box/ratio;else w=box*ratio;const squeeze=Math.min(.14,squish*.13);w*=1+squeeze;h*=1-squeeze;ctx.save();ctx.shadowColor='#80653227';ctx.shadowBlur=scale>1?7:0;ctx.drawImage(img,x-w/2,y-h/2+h*squeeze,w,h);ctx.restore()}
function frame(time){if(!lastTime)lastTime=time;const dt=Math.min(.025,(time-lastTime)/1000);lastTime=time;if(gameStarted&&!gameOver){physics(dt);for(const p of particles)p.life-=dt*1.7;particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(frame)}
renderLeaderboard();loadCloudScores();reset();requestAnimationFrame(frame);
</script>
